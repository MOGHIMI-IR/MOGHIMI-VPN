name: Build Moghimi V2Ray APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".gitmodules"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: moghimi-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app and pinned VPN source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "14742923"
          packages: "platforms;android-37.0 build-tools;37.0.0 platform-tools"
          log-accepted-android-sdk-licenses: false

      - name: Install Android NDK
        shell: bash
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=0 --install "ndk;30.0.16248370"
          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Apply Moghimi branding, cloud sync and updater
        env:
          MOGHIMI_VERSION_CODE: ${{ github.run_number }}
        run: bash android/patch-upstream.sh

      - name: Prepare stable signing key when configured
        shell: bash
        env:
          MOGHIMI_SIGNING_KEYSTORE_BASE64: ${{ secrets.MOGHIMI_SIGNING_KEYSTORE_BASE64 }}
          MOGHIMI_SIGNING_STORE_PASSWORD: ${{ secrets.MOGHIMI_SIGNING_STORE_PASSWORD }}
          MOGHIMI_SIGNING_KEY_ALIAS: ${{ secrets.MOGHIMI_SIGNING_KEY_ALIAS }}
          MOGHIMI_SIGNING_KEY_PASSWORD: ${{ secrets.MOGHIMI_SIGNING_KEY_PASSWORD }}
        run: |
          if [[ -z "$MOGHIMI_SIGNING_KEYSTORE_BASE64" ]]; then
            echo "MOGHIMI_SIGNING_MODE=debug-fallback" >> "$GITHUB_ENV"
            echo "::warning::Stable signing secrets are not configured; Android may reject in-place app updates."
            exit 0
          fi
          if [[ -z "$MOGHIMI_SIGNING_STORE_PASSWORD" || -z "$MOGHIMI_SIGNING_KEY_ALIAS" || -z "$MOGHIMI_SIGNING_KEY_PASSWORD" ]]; then
            echo "::error::All Moghimi signing secrets must be configured together."
            exit 1
          fi
          printf '%s' "$MOGHIMI_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/moghimi-signing.jks"
          test -s "$RUNNER_TEMP/moghimi-signing.jks"
          echo "MOGHIMI_SIGNING_STORE_FILE=$RUNNER_TEMP/moghimi-signing.jks" >> "$GITHUB_ENV"
          echo "MOGHIMI_SIGNING_MODE=stable" >> "$GITHUB_ENV"

      - name: Build native TUN helper
        working-directory: android/upstream
        run: |
          bash compile-hevtun.sh
          mkdir -p V2rayNG/app/libs
          cp -R libs V2rayNG/app/

      - name: Resolve pinned Xray Android library release
        id: xray
        working-directory: android/upstream
        shell: bash
        run: |
          git -C AndroidLibXrayLite fetch --tags --force
          TAG="$(git -C AndroidLibXrayLite describe --tags --abbrev=0)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using AndroidLibXrayLite tag: $TAG"

      - name: Download Xray Android library
        uses: robinraju/release-downloader@v1.13
        with:
          repository: "2dust/AndroidLibXrayLite"
          tag: ${{ steps.xray.outputs.tag }}
          fileName: "libv2ray.aar"
          out-file-path: "android/upstream/V2rayNG/app/libs"

      - name: Run unit tests and build the ARM64 beta APK
        working-directory: android/upstream/V2rayNG
        env:
          MOGHIMI_SIGNING_STORE_PASSWORD: ${{ secrets.MOGHIMI_SIGNING_STORE_PASSWORD }}
          MOGHIMI_SIGNING_KEY_ALIAS: ${{ secrets.MOGHIMI_SIGNING_KEY_ALIAS }}
          MOGHIMI_SIGNING_KEY_PASSWORD: ${{ secrets.MOGHIMI_SIGNING_KEY_PASSWORD }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew testPlaystoreDebugUnitTest assemblePlaystoreDebug -PABI_FILTERS=arm64-v8a --stacktrace

      - name: Generate APK checksums
        shell: bash
        run: |
          mkdir -p release-files
          find android/upstream/V2rayNG/app/build/outputs/apk/playstore/debug -maxdepth 1 -type f -name '*.apk' -print0 \
            | xargs -0 -r sha256sum > release-files/SHA256SUMS
          cp android/upstream/V2rayNG/app/build/outputs/apk/playstore/debug/*.apk release-files/
          APK="$(find android/upstream/V2rayNG/app/build/outputs/apk/playstore/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$APK" > release-files/SIGNING.txt
          echo "Signing mode: ${MOGHIMI_SIGNING_MODE:-debug-fallback}" >> release-files/SIGNING.txt

      - name: Upload ARM64 APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: Moghimi-V2Ray-Android-Beta
          path: release-files/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish public ARM64 beta release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: moghimi-beta-${{ github.run_number }}
          name: Moghimi V2Ray Beta ${{ github.run_number }}
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: release-files/*
          fail_on_unmatched_files: true

      - name: Write build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Moghimi V2Ray — Android"
            echo ""
            echo "- Source: pinned v2rayNG/Xray checkout"
            echo "- App package: ir.moghimi.v2ray"
            echo "- Version: 1.0.0 (build ${{ github.run_number }}, ARM64 only)"
            echo "- Signing mode: ${MOGHIMI_SIGNING_MODE:-debug-fallback}"
            echo "- APK architecture variants are listed in the Artifacts section when the build succeeds."
          } >> "$GITHUB_STEP_SUMMARY"
