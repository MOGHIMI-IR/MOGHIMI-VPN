name: Build Moghimi V2Ray APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".gitmodules"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moghimi-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app and pinned VPN source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "14742923"
          packages: "platforms;android-37.0 build-tools;37.0.0 platform-tools"
          log-accepted-android-sdk-licenses: false

      - name: Install Android NDK
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=0 --install "ndk;30.0.16248370"
          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Apply Moghimi branding and cloud sync
        run: bash android/patch-upstream.sh

      - name: Build native TUN helper
        working-directory: android/upstream
        run: |
          bash compile-hevtun.sh
          mkdir -p V2rayNG/app/libs
          cp -R libs V2rayNG/app/

      - name: Resolve pinned Xray Android library release
        id: xray
        working-directory: android/upstream
        shell: bash
        run: |
          git -C AndroidLibXrayLite fetch --tags --force
          TAG="$(git -C AndroidLibXrayLite describe --tags --abbrev=0)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using AndroidLibXrayLite tag: $TAG"

      - name: Download Xray Android library
        uses: robinraju/release-downloader@v1.13
        with:
          repository: "2dust/AndroidLibXrayLite"
          tag: ${{ steps.xray.outputs.tag }}
          fileName: "libv2ray.aar"
          out-file-path: "android/upstream/V2rayNG/app/libs"

      - name: Run unit tests and build installable beta APKs
        working-directory: android/upstream/V2rayNG
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew testPlaystoreDebugUnitTest assemblePlaystoreDebug --stacktrace

      - name: Generate APK checksums
        shell: bash
        run: |
          mkdir -p release-files
          find android/upstream/V2rayNG/app/build/outputs/apk/playstore/debug -maxdepth 1 -type f -name '*.apk' -print0 \
            | xargs -0 -r sha256sum > release-files/SHA256SUMS
          cp android/upstream/V2rayNG/app/build/outputs/apk/playstore/debug/*.apk release-files/

      - name: Upload APKs and checksums
        uses: actions/upload-artifact@v4
        with:
          name: Moghimi-V2Ray-Android-Beta
          path: release-files/*
          if-no-files-found: error
          retention-days: 30

      - name: Write build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Moghimi V2Ray — Android"
            echo ""
            echo "- Source: pinned v2rayNG/Xray checkout"
            echo "- App package: ir.moghimi.v2ray"
            echo "- Version: 1.0.0 (beta)"
            echo "- APK architecture variants are listed in the Artifacts section when the build succeeds."
          } >> "$GITHUB_STEP_SUMMARY"
