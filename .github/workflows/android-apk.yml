name: Build Moghimi V2Ray APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".gitmodules"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: moghimi-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app and pinned VPN source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "14742923"
          packages: "platforms;android-37.0 build-tools;37.0.0 platform-tools"
          log-accepted-android-sdk-licenses: false

      - name: Install Android NDK
        shell: bash
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=0 --install "ndk;30.0.16248370"
          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Apply Moghimi branding, cloud sync and updater
        env:
          MOGHIMI_VERSION_CODE: ${{ github.run_number }}
        run: bash android/patch-upstream.sh

      - name: Prepare stable signing key when configured
        shell: bash
        env:
          MOGHIMI_SIGNING_KEYSTORE_BASE64: ${{ secrets.MOGHIMI_SIGNING_KEYSTORE_BASE64 }}
          MOGHIMI_SIGNING_STORE_PASSWORD: ${{ secrets.MOGHIMI_SIGNING_STORE_PASSWORD }}
          MOGHIMI_SIGNING_KEY_ALIAS: ${{ secrets.MOGHIMI_SIGNING_KEY_ALIAS }}
          MOGHIMI_SIGNING_KEY_PASSWORD: ${{ secrets.MOGHIMI_SIGNING_KEY_PASSWORD }}
        run: |
          if [[ -z "$MOGHIMI_SIGNING_KEYSTORE_BASE64" ]]; then
            echo "MOGHIMI_SIGNING_MODE=debug-fallback" >> "$GITHUB_ENV"
            echo "::warning::Stable signing secrets are not configured; Android may reject in-place app updates."
            exit 0
          fi
          if [[ -z "$MOGHIMI_SIGNING_STORE_PASSWORD" || -z "$MOGHIMI_SIGNING_KEY_ALIAS" || -z "$MOGHIMI_SIGNING_KEY_PASSWORD" ]]; then
            echo "::error::All Moghimi signing secrets must be configured together."
            exit 1
          fi
          printf '%s' "$MOGHIMI_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/moghimi-signing.jks"
          test -s "$RUNNER_TEMP/moghimi-signing.jks"
          echo "MOGHIMI_SIGNING_STORE_FILE=$RUNNER_TEMP/moghimi-signing.jks" >> "$GITHUB_ENV"
          echo "MOGHIMI_SIGNING_MODE=stable" >> "$GITHUB_ENV"

      - name: Build native TUN helper
        working-directory: android/upstream
        run: |
          bash compile-hevtun.sh
          mkdir -p V2rayNG/app/libs
          cp -R libs V2rayNG/app/

      - name: Resolve pinned Xray Android library release
        id: xray
        working-directory: android/upstream
        shell: bash
        run: |
          git -C AndroidLibXrayLite fetch --tags --force
          TAG="$(git -C AndroidLibXrayLite describe --tags --abbrev=0)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using AndroidLibXrayLite tag: $TAG"

      - name: Download Xray Android library
        uses: robinraju/release-downloader@v1.13
        with:
          repository: "2dust/AndroidLibXrayLite"
          tag: ${{ steps.xray.outputs.tag }}
          fileName: "libv2ray.aar"
          out-file-path: "android/upstream/V2rayNG/app/libs"

      - name: Run unit tests and build the ARM64 release APK
        working-directory: android/upstream/V2rayNG
        env:
          MOGHIMI_VERSION_CODE: ${{ github.run_number }}
          MOGHIMI_SIGNING_STORE_PASSWORD: ${{ secrets.MOGHIMI_SIGNING_STORE_PASSWORD }}
          MOGHIMI_SIGNING_KEY_ALIAS: ${{ secrets.MOGHIMI_SIGNING_KEY_ALIAS }}
          MOGHIMI_SIGNING_KEY_PASSWORD: ${{ secrets.MOGHIMI_SIGNING_KEY_PASSWORD }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew testPlaystoreDebugUnitTest assemblePlaystoreRelease -PABI_FILTERS=arm64-v8a --stacktrace

      - name: Generate APK checksums
        shell: bash
        run: |
          mkdir -p release-files
          APK_DIR="android/upstream/V2rayNG/app/build/outputs/apk/playstore/release"
          APK="$APK_DIR/MoghimiV2Ray_1.0.4_arm64-v8a.apk"
          test -s "$APK"

          # Verify the actual packaged version code. Playstore ARM64 outputs use a
          # 4,000,000 ABI offset; the remainder must equal this CI run number.
          EXPECTED_VERSION_CODE="$((4000000 + GITHUB_RUN_NUMBER))"
          BADGING="$("$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK")"
          grep -F "package: name='ir.moghimi.v2ray'" <<< "$BADGING" >/dev/null
          grep -F "versionCode='$EXPECTED_VERSION_CODE' versionName='1.0.4'" <<< "$BADGING" >/dev/null || {
            echo "::error::APK versionCode mismatch. Expected $EXPECTED_VERSION_CODE for build $GITHUB_RUN_NUMBER."
            exit 1
          }
          if grep -q '^application-debuggable$' <<< "$BADGING"; then
            echo "::error::A debuggable APK cannot be published as the production release."
            exit 1
          fi

          # Confirm the VPN APK does not request broad package inventory or
          # the ability to install APKs itself.
          PERMISSIONS="$("$ANDROID_HOME/build-tools/37.0.0/aapt" dump permissions "$APK")"
          for FORBIDDEN_PERMISSION in \
            android.permission.REQUEST_INSTALL_PACKAGES \
            android.permission.QUERY_ALL_PACKAGES; do
            if grep -Fq "$FORBIDDEN_PERMISSION" <<< "$PERMISSIONS"; then
              echo "::error::Unnecessary high-risk permission found in APK: $FORBIDDEN_PERMISSION"
              exit 1
            fi
          done

          sha256sum "$APK" > release-files/SHA256SUMS
          cp "$APK" release-files/
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$APK" > release-files/SIGNING.txt
          echo "Signing mode: ${MOGHIMI_SIGNING_MODE:-debug-fallback}" >> release-files/SIGNING.txt
          grep -Eiq "certificate SHA-256 digest: 34996e2abdb1705849dd11963fb8cae2a6936ca0237cf44bc2bfe59978da5cdf" release-files/SIGNING.txt || {
            echo "::error::APK does not use the previously established Moghimi stable signing certificate."
            exit 1
          }
          test "${MOGHIMI_SIGNING_MODE:-}" = "stable"

      - name: Upload ARM64 APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: Moghimi-V2Ray-Android-Beta
          path: release-files/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish public ARM64 beta release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: moghimi-beta-${{ github.run_number }}
          name: Moghimi V2Ray Beta ${{ github.run_number }}
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: release-files/*
          fail_on_unmatched_files: true

      - name: Sync verified APK to the Supabase download object
        id: supabase
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [[ -z "$SUPABASE_SERVICE_ROLE_KEY" ]]; then
            echo "status=skipped (SUPABASE_SERVICE_ROLE_KEY secret is not configured)" >> "$GITHUB_OUTPUT"
            echo "::warning::APK is published on GitHub, but Supabase sync was skipped. Add SUPABASE_SERVICE_ROLE_KEY to repository Actions secrets to enable it."
            exit 0
          fi

          APK="release-files/MoghimiV2Ray_1.0.4_arm64-v8a.apk"
          test -s "$APK"
          OBJECT_URL="https://atrwhvyhopifugphfcpe.supabase.co/storage/v1/object/app-releases/MoghimiV2Ray_1.0.0_arm64-v8a%20%281%29.apk"
          PUBLIC_URL="https://atrwhvyhopifugphfcpe.supabase.co/storage/v1/object/public/app-releases/MoghimiV2Ray_1.0.0_arm64-v8a%20%281%29.apk"

          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 2 \
            --request POST "$OBJECT_URL" \
            --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Content-Type: application/vnd.android.package-archive" \
            --header "Cache-Control: max-age=60" \
            --header "x-upsert: true" \
            --data-binary @"$APK" \
            --output "$RUNNER_TEMP/supabase-upload-response.json"

          # Verify the public object, not only the authenticated upload response.
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 \
            "$PUBLIC_URL?moghimi_build=${GITHUB_RUN_NUMBER}" \
            --output "$RUNNER_TEMP/supabase-verified.apk"

          EXPECTED_SHA="$(sha256sum "$APK" | awk '{print $1}')"
          ACTUAL_SHA="$(sha256sum "$RUNNER_TEMP/supabase-verified.apk" | awk '{print $1}')"
          if [[ "$EXPECTED_SHA" != "$ACTUAL_SHA" ]]; then
            echo "::error::Supabase public APK does not match the newly published GitHub APK."
            exit 1
          fi
          if ! cmp --silent "$APK" "$RUNNER_TEMP/supabase-verified.apk"; then
            echo "::error::Supabase APK byte comparison failed."
            exit 1
          fi

          echo "status=uploaded and SHA-256 verified" >> "$GITHUB_OUTPUT"
          echo "Supabase fixed ARM64 object was uploaded and verified."

      - name: Write build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Moghimi V2Ray — Android"
            echo ""
            echo "- Source: pinned v2rayNG/Xray checkout"
            echo "- App package: ir.moghimi.v2ray"
            echo "- Version: 1.0.4 (build ${{ github.run_number }}, ARM64 only)"
            echo "- Signing mode: ${MOGHIMI_SIGNING_MODE:-debug-fallback}"
            echo "- Supabase sync: ${{ steps.supabase.outputs.status }}"
            echo "- APK architecture variants are listed in the Artifacts section when the build succeeds."
          } >> "$GITHUB_STEP_SUMMARY"
